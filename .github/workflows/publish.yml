name: Timer Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Packages
        run: pnpm i

      - name: Testing the code
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Deploy Dist
        run: >-
          rsync -rlci --delete dist
          ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.FRONTEND_DEPLOY_PATH }}

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: Test
        working-directory: backend
        run: go vet ./... && go test ./...

      - name: Build
        working-directory: backend
        run: go build -o bin/timer-api ./cmd/api

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Deploy binary and migrations
        run: |
          rsync -rlci backend/migrations ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.BACKEND_DEPLOY_PATH }}
          rsync -lci backend/bin/timer-api ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.BACKEND_DEPLOY_PATH }}bin/timer-api

      - name: Restart service
        run: ssh ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} 'sudo systemctl restart ${{ vars.BACKEND_SERVICE_NAME }}'
